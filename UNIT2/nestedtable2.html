<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NESTED TABLE</title>
</head>

<body>
    <table border="2" cellpadding="30" cellspacing="20">
        <caption>THIS IS A NESTED TABLE</caption>
        <tr>
            <th>FIRST</th>
            <th>SECOND</th>
            <th>THIRD</th>
        </tr>
        <tr>
            <td>HELLO </td>
            <td>HAI</td>
            <td>
                <table>
                    <tr><th>HELLO 2</th><th>HELLO 3</th></tr>
                    <tr><td>HAI</td><td>HAI 3</td></tr>
                </table>
            </td>
           
        </tr>
    </table>
</body>

</html>
