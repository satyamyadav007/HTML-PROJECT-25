<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROWSPAN</title>
    <style>
        table,th,td{
            border: 3px solid black;
            border-collapse: collapse;

        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>NAME</th><td>SATYAM</td>
        </tr>
        <tr>
            <th rowspan="2">PHONE</th><td>12345</td>
        </tr>
        <tr>
            <td>12345</td>
        </tr>
    </table>
</body>
</html>
