<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLSPAN</title>
    <style>
        table,th,td{
            border: 2px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="2">NAME</th><th>AGE</th>
        </tr>
        <tr>
            <td>SATYAM</td>
            <td>YADAV</td>
            <td>20</td>
        </tr>
        <tr>
            <td>ARYAN</td>
            <td>YADAV</td>
            <td>15</td>
        </tr>
    </table>
</body>
</html>
