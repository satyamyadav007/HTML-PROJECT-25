<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISPLAY GRID</title>
</head>

<body> 
    <div style="display: grid;grid-template-columns: repeat(2,1fr); border: 2px solid rgb(231, 10, 10);">
    <div style="background-color: pink;"> 1 </div>
    <div style="background-color: yellow;"> 2 </div>
    <div style="background-color: rgb(60, 0, 255);"> 3 </div>
    <div style="background-color: rgb(92, 4, 69);"> 4 </div>
    <div style="background-color: rgb(255, 0, 225);"> 5 </div>
    <div style="background-color: rgb(22, 228, 211);"> 6 </div>
    </div>
</body>

</html>
